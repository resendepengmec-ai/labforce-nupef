<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 400" width="740" height="400" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="14" fill="#17201c">
  <title>Corte ortogonal: forças na face de saída da ferramenta (análise de Merchant)</title>
  <desc>Esquema original. A peça avança contra a ferramenta com velocidade vc; o cavaco sobe pela face de saída, inclinada do ângulo de saída γ0 em relação à vertical. Na face atuam a força tangencial FT, ao longo da face, e a força normal FN. À direita, a decomposição: as forças medidas Fc, na direção da velocidade, e Ff, perpendicular a ela, somam a resultante R, que também é a soma de FT e FN; β é o ângulo de atrito entre R e FN.</desc>
  <defs>
    
    <pattern id="hach" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#9aa59f" stroke-width="1"/></pattern>
  </defs>
  <rect width="740" height="400" fill="#ffffff"/>
  <text x="270" y="24" text-anchor="middle" font-weight="600">Corte ortogonal (ferramenta com γ0 = 10°)</text>
  <text x="635" y="24" text-anchor="middle" font-weight="600">Decomposição das forças</text>

  <!-- peca: camada a remover acima de y=250, superficie usinada em y=280 -->
  <path d="M20 250 L250 250 L300 280 L520 280 L520 350 L20 350 Z" fill="#e4e8e5" stroke="#5e6a64" stroke-width="1.5"/>
  <path d="M20 350 L520 350" stroke="url(#hach)" stroke-width="10"/>
  <text x="70" y="325">peça</text>
  <line x1="60.0" y1="300.0" x2="142.0" y2="300.0" stroke="#17201c" stroke-width="2"/><path d="M150.0 300.0 L139.0 304.2 L139.0 295.8 Z" fill="#17201c"/>
  <text x="160" y="305">v<tspan dy="4" font-size="11">c</tspan><tspan dy="-4">&#8203;</tspan></text>

  <!-- cavaco -->
  <path d="M250 250 L300 280 L316.7 185 Q312 140 275 128 Q245 124 240 150 Q236 185 250 250 Z" fill="#f3e2c3" stroke="#8a6d3b" stroke-width="1.5"/>
  <text x="246" y="175">cavaco</text>
  <text x="150" y="214" font-size="12" fill="#5e6a64">plano de</text>
  <text x="150" y="228" font-size="12" fill="#5e6a64">cisalhamento</text>
  <line x1="222" y1="232" x2="272" y2="262" stroke="#5e6a64" stroke-width="1"/>

  <!-- ferramenta: face de saida da ponta (300,280) ate (328.2,120); folga ate (500,262) -->
  <path d="M300 280 L328.2 120 L500 120 L500 262 Z" fill="#c9ced3" stroke="#3b4248" stroke-width="1.5"/>
  <text x="420" y="200" text-anchor="middle">ferramenta</text>
  <text x="338" y="140" font-size="12" fill="#3b4248">face de saída</text>

  <!-- gamma0: vertical tracejada pela ponta e arco ate a face -->
  <line x1="300" y1="280" x2="300" y2="150" stroke="#5e6a64" stroke-width="1" stroke-dasharray="5 4"/>
  <path d="M300 170 A110 110 0 0 1 319.1 171.7" fill="none" stroke="#17201c" stroke-width="1.2"/>
  <text x="302" y="163" font-size="13">γ<tspan dy="4" font-size="10">0</tspan><tspan dy="-4">&#8203;</tspan></text>

  <!-- forcas na face (sobre a ferramenta) -->
  <line x1="309.3" y1="255.9" x2="316.6" y2="214.6" stroke="#0b7a5a" stroke-width="2.5"/><path d="M318.0 206.7 L320.2 218.3 L311.9 216.8 Z" fill="#0b7a5a"/>
  <text x="324" y="222" font-weight="600">F<tspan dy="4" font-size="11">T</tspan><tspan dy="-4">&#8203;</tspan></text>
  <line x1="309.3" y1="255.9" x2="360.5" y2="264.9" stroke="#6b3fa0" stroke-width="2.5"/><path d="M368.4 266.3 L356.8 268.5 L358.3 260.3 Z" fill="#6b3fa0"/>
  <text x="372" y="258" font-weight="600">F<tspan dy="4" font-size="11">N</tspan><tspan dy="-4">&#8203;</tspan></text>

  <!-- painel de decomposicao, origem O = (590,260) -->
  <rect x="535" y="40" width="195" height="290" rx="6" fill="#f7f8f7" stroke="#c8cfca"/>
  <line x1="590" y1="260" x2="607.4" y2="161.5" stroke="#5e6a64" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="611" y="158" font-size="11" fill="#5e6a64">direção da face</text>
  <line x1="590" y1="260" x2="590" y2="150" stroke="#5e6a64" stroke-width="1" stroke-dasharray="2 3"/>
  <line x1="590.0" y1="260.0" x2="672.0" y2="260.0" stroke="#dc0000" stroke-width="2.5"/><path d="M680.0 260.0 L669.0 264.2 L669.0 255.8 Z" fill="#dc0000"/>
  <text x="684" y="276" font-weight="600">F<tspan dy="4" font-size="11">c</tspan><tspan dy="-4">&#8203;</tspan></text>
  <line x1="590.0" y1="260.0" x2="590.0" y2="223.0" stroke="#0000cd" stroke-width="2.5"/><path d="M590.0 215.0 L594.2 226.0 L585.8 226.0 Z" fill="#0000cd"/>
  <text x="560" y="222" font-weight="600">F<tspan dy="4" font-size="11">f</tspan><tspan dy="-4">&#8203;</tspan></text>
  <line x1="590.0" y1="260.0" x2="672.8" y2="218.6" stroke="#17201c" stroke-width="1.5" stroke-dasharray="6 4"/><path d="M680.0 215.0 L672.0 223.7 L668.3 216.2 Z" fill="#17201c"/>
  <text x="686" y="212">R</text>
  <line x1="680" y1="260" x2="680" y2="215" stroke="#9aa59f" stroke-width="1" stroke-dasharray="2 3"/>
  <line x1="590.0" y1="260.0" x2="599.0" y2="208.9" stroke="#0b7a5a" stroke-width="2.5"/><path d="M600.4 201.0 L602.6 212.6 L594.4 211.1 Z" fill="#0b7a5a"/>
  <text x="606" y="196" font-weight="600">F<tspan dy="4" font-size="11">T</tspan><tspan dy="-4">&#8203;</tspan></text>
  <line x1="590.0" y1="260.0" x2="661.7" y2="272.6" stroke="#6b3fa0" stroke-width="2.5"/><path d="M669.6 274.0 L658.0 276.2 L659.5 268.0 Z" fill="#6b3fa0"/>
  <text x="650" y="296" font-weight="600">F<tspan dy="4" font-size="11">N</tspan><tspan dy="-4">&#8203;</tspan></text>
  <path d="M590 185 A75 75 0 0 1 603 186.1" fill="none" stroke="#17201c" stroke-width="1.2"/>
  <text x="597" y="178" font-size="12" text-anchor="middle">γ<tspan dy="4" font-size="9">0</tspan><tspan dy="-4">&#8203;</tspan></text>
  <path d="M644.2 269.5 A55 55 0 0 0 639.2 235.4" fill="none" stroke="#17201c" stroke-width="1.2"/>
  <text x="648" y="252" font-size="13">β</text>
  <text x="545" y="62" font-size="12" fill="#3b4248">medidas: F<tspan dy="4" font-size="9">c</tspan><tspan dy="-4">&#8203;</tspan> ∥ v<tspan dy="4" font-size="9">c</tspan><tspan dy="-4">&#8203;</tspan>, F<tspan dy="4" font-size="9">f</tspan><tspan dy="-4">&#8203;</tspan> ⊥ v<tspan dy="4" font-size="9">c</tspan><tspan dy="-4">&#8203;</tspan></text>
  <text x="545" y="80" font-size="12" fill="#3b4248">na face: F<tspan dy="4" font-size="9">T</tspan><tspan dy="-4">&#8203;</tspan> (atrito), F<tspan dy="4" font-size="9">N</tspan><tspan dy="-4">&#8203;</tspan> (normal)</text>
  <text x="545" y="98" font-size="12" fill="#3b4248">R = F<tspan dy="4" font-size="9">c</tspan><tspan dy="-4">&#8203;</tspan> + F<tspan dy="4" font-size="9">f</tspan><tspan dy="-4">&#8203;</tspan> = F<tspan dy="4" font-size="9">T</tspan><tspan dy="-4">&#8203;</tspan> + F<tspan dy="4" font-size="9">N</tspan><tspan dy="-4">&#8203;</tspan></text>
  <text x="545" y="316" font-size="12" fill="#3b4248">μ = F<tspan dy="4" font-size="9">T</tspan><tspan dy="-4">&#8203;</tspan>/F<tspan dy="4" font-size="9">N</tspan><tspan dy="-4">&#8203;</tspan> = tan β</text>

  <!-- formulas -->
  <text x="20" y="378" font-size="13">F<tspan dy="4" font-size="10">T</tspan><tspan dy="-4">&#8203;</tspan> = F<tspan dy="4" font-size="10">c</tspan><tspan dy="-4">&#8203;</tspan>·sen γ<tspan dy="4" font-size="10">0</tspan><tspan dy="-4">&#8203;</tspan> + F<tspan dy="4" font-size="10">f</tspan><tspan dy="-4">&#8203;</tspan>·cos γ<tspan dy="4" font-size="10">0</tspan><tspan dy="-4">&#8203;</tspan>&#160;&#160;&#160;&#160;&#160;F<tspan dy="4" font-size="10">N</tspan><tspan dy="-4">&#8203;</tspan> = F<tspan dy="4" font-size="10">c</tspan><tspan dy="-4">&#8203;</tspan>·cos γ<tspan dy="4" font-size="10">0</tspan><tspan dy="-4">&#8203;</tspan> − F<tspan dy="4" font-size="10">f</tspan><tspan dy="-4">&#8203;</tspan>·sen γ<tspan dy="4" font-size="10">0</tspan><tspan dy="-4">&#8203;</tspan>&#160;&#160;&#160;&#160;&#160;μ = F<tspan dy="4" font-size="10">T</tspan><tspan dy="-4">&#8203;</tspan>/F<tspan dy="4" font-size="10">N</tspan><tspan dy="-4">&#8203;</tspan>&#160;&#160;&#160;&#160;&#160;β = arctan μ</text>
  <text x="20" y="395" font-size="11" fill="#5e6a64">Esquema original do LabForce NUPEF, conforme Merchant (1945) e Puls, Klocke e Lung (2014). Fora de escala.</text>
</svg>
